name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    # Releases are built only on the public mirror, where the export pipeline
    # pushes each release tag. On the internal repo this file is just the
    # source that gets exported; guard it so internal tags don't produce
    # duplicate or failing release runs.
    if: github.repository == 'matiadata/terraform-provider-matia'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            BEGIN { gsub(/\./, "\\.", ver); re = "^## \\[" ver "\\]" }
            /^## \[/ { if (found) exit; if ($0 ~ re) { found = 1 }; next }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/release-notes.md"
          if [ -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "Release body: $(wc -l < "$RUNNER_TEMP/release-notes.md") lines from CHANGELOG for ${version}."
          else
            echo "::warning::No CHANGELOG section for ${version}; release body will be empty."
          fi
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Keep in sync with the goreleaser version pinned in the justfile.
          version: 'v2.17.0'
          # Notes live outside the work tree: goreleaser aborts on a dirty tree,
          # and an untracked release-notes.md in the repo root is enough to fail it.
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
