name: Feature request
description: Suggest a new capability for the Matia Terraform provider
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case rather than only the solution — it helps us design the right thing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like the provider to do? Example configuration is welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New resource or data source
        - Existing resource behavior
        - Provider configuration
        - Documentation
        - Other
    validations:
      required: true
